# suji options, with their default values.
#
# Copy this file to script-opts/suji.conf in mpv's configuration folder and
# change what you need. One option per line, key=value, no spaces around
# the "=". Lines starting with # are comments. Booleans are yes or no.
#
# This file is read when mpv starts. To change an option while mpv is
# running, use the script-opts property instead, with a "suji-" prefix:
#   change-list script-opts append suji-scale=1.5       (console)
#   F9 change-list script-opts append suji-enabled=no   (input.conf)
# A change made like that lasts until mpv is closed.

# no: suji draws nothing, takes no clicks and gives mpv's own controller
# (OSC) back if suji was the one that turned it off.
enabled=yes

# 2 px progress line along the bottom edge while the controls are hidden.
# no: nothing on screen at rest.
idle_line=yes

# Colour of the progress and the knob, as rrggbb (no #).
accent=ffffff

# Pause while dragging the timeline, and resume when you let go.
pause_on_drag=no

# Show the remaining time ("-13:52") instead of the duration. A click on
# the time switches between the two.
remaining_time=no

# Seconds without mouse movement before the controls hide (0 to 3600).
hide_delay=1.5

# Distance in px, at scale 1, from which the bar starts to react to the
# mouse (1 to 10000).
proximity=120

# Size factor (0.25 to 8). It is multiplied by the system's HiDPI scale,
# and by the size chosen in the more menu: 100% there is this value, 125%
# is 1.25 times it (the result stays within 0.25 to 8).
scale=1

# Thumbnails on the timeline, made by thumbfast, a separate script (see
# the README). no: suji never asks thumbfast for them, and the time under
# the cursor stays in the row.
thumbnails=yes

# Log sizes, scale and messages to the mpv console.
debug=no

# The row of controls, from left to right, separated by commas. The
# timeline and the title are always there and do not go in this list.
#
# Elements:
#   pause        play/pause button
#   time         position / duration; a click shows the remaining time
#   volume       speaker (a click mutes) and slider; the wheel changes it
#   fullscreen   fullscreen button
#   subtitles    menu: Off, the subtitle tracks, and loading subtitles
#                from the clipboard (mpv 0.40 or newer). Shown whenever a
#                file is loaded.
#   audio        menu: the audio tracks. Shown with more than one.
#   playlist     menu: the chapters and the playlist (video and audio
#                files, URLs and the file playing; not folders). Shown
#                when the file has chapters or more than one entry to list.
#   speed        menu: the playback speeds, 0.25x to 4x. Away from 1x the
#                button shows the speed in its corner. Shown whenever a
#                file is loaded.
#   more         menu: the video track and the editions (when there is a
#                choice), opening a file or URL from the clipboard (mpv
#                0.40 or newer) and Size, from 75% to 150% of scale,
#                remembered on each computer in suji-size, a file in mpv's
#                state folder when it exists, else in this configuration
#                folder (on macOS they are the same; see the README).
#                Shown whenever a file is loaded.
#                (each of these nine can be in the list once; a menu
#                button with nothing to offer hides and leaves no gap)
#                Both clipboard entries, Load (subtitles) and Open (more),
#                only take a local path, file://, http:// or https://; any
#                other address is refused.
#   space        takes the free width: what follows it goes to the right.
#                With several, they share the free width.
#   gap          a small fixed hole
#   command:icon:command?text
#                a button that runs an mpv input command when clicked, for
#                example command:x:cycle sub. icon is a name from suji's
#                icons (listed in docs/api.md: play, pause, star, speed,
#                settings...); for any other name the button shows its
#                first letter. ?text is optional: it is accepted and
#                kept, but not shown. The
#                command cannot contain commas (they end the element) nor
#                "?" (it starts the text).
#                The command runs as a line of input.conf would: ";" chains
#                several commands and ${...} is replaced by the value of a
#                property, inside each argument. So never hand a property
#                that comes from the file (${media-title}, ${filename}...)
#                to a shell (run sh -c "... ${media-title}"): the title
#                could hold commands of its own. The raw prefix (raw run
#                ...) turns off ${...}. Even without a shell, a file name
#                that starts with "-" can be taken for an option of the
#                program (run prog ${filename}): put -- before it if the
#                program takes it (run prog -- ${filename}), or use
#                ${path} when mpv opens files by their absolute path (it
#                starts with "/", or a drive on Windows). And with
#                use-filedir-conf=yes, a .conf file next to a video can
#                set this option, and so add buttons: only use it with
#                files you trust.
#   button:name  a button another script defines with the set-button
#                message (see docs/api.md). It takes no room until that
#                script sets it. The name is made of letters, digits, _
#                and -.
#
# Conditions: <...> before an element shows it only when they hold. A
# hidden element leaves no gap. Names:
#   video          a video track that is not cover art is playing
#   audio          an audio track is playing
#   stream         the file comes from the network
#   has_chapter    the file has chapters
#   has_playlist   the playlist has more than one entry (any entry, folders
#                  too: it can differ from the playlist button)
#   idle           mpv is idle, with no file
#   any mpv property or user-data/..., which holds when it exists and is
#   not false, no, 0 or empty (the texts "false" and "0" count as false
#   too: set user-data/x 0 in input.conf gives the text "0")
# "," is OR, "+" is AND and "!" negates the name right after it. "!" binds
# tightest, then "+", then ",": <a,b+!c> means a, or b and not c. Commas
# inside <...> do not separate elements.
#
# Unknown or badly written elements are skipped with a warning in the mpv
# console. At most 32 elements and 4096 bytes are read (an element cut in
# half at the end is left out), and conditions watch at most 64 properties:
# the rest count as false.
#
# Examples:
#   controls=pause,space,volume,fullscreen
#   controls=pause,time,space,<has_playlist>command:x:playlist-next,gap,volume,fullscreen
#   controls=pause,time,space,<video+!stream>command:x:screenshot?Screenshot,volume,fullscreen
#
# While mpv runs, change it with -append, which keeps the commas:
#   change-list script-opts append suji-controls=pause,space,fullscreen
controls=pause,time,space,subtitles,audio,playlist,speed,more,volume,fullscreen
